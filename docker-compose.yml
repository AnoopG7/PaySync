services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - paysync-data:/app/data
    environment:
      - DB_TYPE=sqlite
      - JWT_SECRET=paysync-docker-secret
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paysync-data:
