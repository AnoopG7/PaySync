services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - paysync-data:/app/data
    env_file: .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paysync-data:
